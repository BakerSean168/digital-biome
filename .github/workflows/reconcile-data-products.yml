name: Reconcile data products

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  products:
    strategy:
      fail-fast: false
      matrix:
        product: [knowledge-public-v1, pds-catalog-v1, infra-public-v2]
    uses: ./.github/workflows/sync-data-products.yml
    with:
      product: ${{ matrix.product }}
      reconcile: true
    secrets: inherit
