name: Deploy Production

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Published immutable release tag (for example v0.6.0)
        required: true
        type: string

concurrency:
  group: production-release-selection
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  verify-release:
    name: Verify published Release contract
    runs-on: ubuntu-latest
    outputs:
      revision: ${{ steps.identity.outputs.revision }}
      release_tag: ${{ steps.identity.outputs.release_tag }}
      release_digest: ${{ steps.identity.outputs.release_digest }}
      manifest_schema: ${{ steps.identity.outputs.manifest_schema }}
      knowledge_source_revision: ${{ steps.identity.outputs.knowledge_source_revision }}
      knowledge_release_tag: ${{ steps.identity.outputs.knowledge_release_tag }}
      knowledge_artifact_sha256: ${{ steps.identity.outputs.knowledge_artifact_sha256 }}
      knowledge_manifest_sha256: ${{ steps.identity.outputs.knowledge_manifest_sha256 }}
      public_infrastructure_source_revision: ${{ steps.identity.outputs.public_infrastructure_source_revision }}
      public_infrastructure_release_tag: ${{ steps.identity.outputs.public_infrastructure_release_tag }}
      public_infrastructure_artifact_sha256: ${{ steps.identity.outputs.public_infrastructure_artifact_sha256 }}
      public_infrastructure_manifest_sha256: ${{ steps.identity.outputs.public_infrastructure_manifest_sha256 }}
      private_infrastructure_source_revision: ${{ steps.identity.outputs.private_infrastructure_source_revision }}
      private_infrastructure_contract_path: ${{ steps.identity.outputs.private_infrastructure_contract_path }}
      private_infrastructure_sha256: ${{ steps.identity.outputs.private_infrastructure_sha256 }}
    steps:
      - id: published
        name: Resolve Published Release tag identity
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]] || {
            echo 'release_tag must be an immutable vX.Y.Z release' >&2
            exit 1
          }

          release_json="$(gh release view "$RELEASE_TAG" \
            --repo "$REPOSITORY" \
            --json isDraft,isPrerelease,tagName)"
          [[ "$(jq -r .tagName <<<"$release_json")" == "$RELEASE_TAG" ]] || {
            echo 'release lookup/tag mismatch' >&2
            exit 1
          }
          [[ "$(jq -r .isDraft <<<"$release_json")" == false ]] || {
            echo 'Draft Release cannot be deployed' >&2
            exit 1
          }
          [[ "$(jq -r .isPrerelease <<<"$release_json")" == false ]] || {
            echo 'prerelease is not eligible for production' >&2
            exit 1
          }

          tag_ref="$(gh api "repos/$REPOSITORY/git/ref/tags/$RELEASE_TAG")"
          tag_object_sha="$(jq -r .object.sha <<<"$tag_ref")"
          tag_type="$(jq -r .object.type <<<"$tag_ref")"
          [[ "$tag_type" == tag ]] || {
            echo 'production requires an annotated Release provenance tag' >&2
            exit 1
          }

          tag_object="$(gh api "repos/$REPOSITORY/git/tags/$tag_object_sha")"
          [[ "$(jq -r .object.type <<<"$tag_object")" == commit ]] || {
            echo 'Release tag must point to a commit' >&2
            exit 1
          }
          tag_sha="$(jq -r .object.sha <<<"$tag_object")"
          [[ "$tag_sha" =~ ^[0-9a-f]{40}$ ]] || {
            echo 'release tag does not resolve to a full Git SHA' >&2
            exit 1
          }
          {
            echo "tag_sha=$tag_sha"
            echo "tag_object_sha=$tag_object_sha"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout exact release source
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.published.outputs.tag_sha }}
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm

      - name: Install release verification tooling
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Download immutable Published Release assets
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/deploy
          gh release download "$RELEASE_TAG" \
            --repo "$REPOSITORY" \
            --pattern release-manifest.json \
            --pattern digital-biome-pages.tar.gz \
            --dir reports/deploy
          test -s reports/deploy/release-manifest.json
          test -s reports/deploy/digital-biome-pages.tar.gz

      - id: identity
        name: Validate Release manifest and immutable artifact
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          REQUESTED_TAG: ${{ inputs.release_tag }}
          TAG_SHA: ${{ steps.published.outputs.tag_sha }}
          TAG_OBJECT_SHA: ${{ steps.published.outputs.tag_object_sha }}
        shell: bash
        run: |
          set -euo pipefail
          manifest=reports/deploy/release-manifest.json
          artifact=reports/deploy/digital-biome-pages.tar.gz

          pnpm exec tsx scripts/delivery/manifest.ts validate --file "$manifest"
          pnpm exec tsx scripts/delivery/release-contract.ts --require-release

          revision="$(jq -r .gitSha "$manifest")"
          release_tag="$(jq -r .tag "$manifest")"
          release_digest="$(jq -r .digest "$manifest")"
          manifest_schema="$(jq -r .schema "$manifest")"

          knowledge_source_revision=''
          knowledge_release_tag=''
          knowledge_artifact_sha256=''
          knowledge_manifest_sha256=''
          public_infrastructure_source_revision=''
          public_infrastructure_release_tag=''
          public_infrastructure_artifact_sha256=''
          public_infrastructure_manifest_sha256=''
          private_infrastructure_source_revision=''
          private_infrastructure_contract_path=''
          private_infrastructure_sha256=''

          case "$manifest_schema" in
            digital-biome.release/v5)
              private_infrastructure_source_revision="$(jq -r '.privateBindings["digital-biome-private-infrastructure-v1"].sourceRevision' "$manifest")"
              private_infrastructure_contract_path="$(jq -r '.privateBindings["digital-biome-private-infrastructure-v1"].contractPath' "$manifest")"
              private_infrastructure_sha256="$(jq -r '.privateBindings["digital-biome-private-infrastructure-v1"].sha256' "$manifest")"
              ;;
            digital-biome.release/v4)
              knowledge_source_revision="$(jq -r .knowledge.sourceRevision "$manifest")"
              knowledge_release_tag="$(jq -r .knowledge.releaseTag "$manifest")"
              knowledge_artifact_sha256="$(jq -r .knowledge.artifactSha256 "$manifest")"
              knowledge_manifest_sha256="$(jq -r .knowledge.manifestSha256 "$manifest")"
              public_infrastructure_source_revision="$(jq -r .publicInfrastructure.sourceRevision "$manifest")"
              public_infrastructure_release_tag="$(jq -r .publicInfrastructure.releaseTag "$manifest")"
              public_infrastructure_artifact_sha256="$(jq -r .publicInfrastructure.artifactSha256 "$manifest")"
              public_infrastructure_manifest_sha256="$(jq -r .publicInfrastructure.manifestSha256 "$manifest")"
              private_infrastructure_source_revision="$(jq -r .privateInfrastructure.sourceRevision "$manifest")"
              private_infrastructure_contract_path="$(jq -r .privateInfrastructure.contractPath "$manifest")"
              private_infrastructure_sha256="$(jq -r .privateInfrastructure.sha256 "$manifest")"
              ;;
            digital-biome.release/v3)
              knowledge_source_revision="$(jq -r .knowledge.sourceRevision "$manifest")"
              knowledge_release_tag="$(jq -r .knowledge.releaseTag "$manifest")"
              knowledge_artifact_sha256="$(jq -r .knowledge.artifactSha256 "$manifest")"
              knowledge_manifest_sha256="$(jq -r .knowledge.manifestSha256 "$manifest")"
              private_infrastructure_source_revision="$(jq -r .privateInfrastructure.sourceRevision "$manifest")"
              private_infrastructure_contract_path="$(jq -r .privateInfrastructure.contractPath "$manifest")"
              private_infrastructure_sha256="$(jq -r .privateInfrastructure.sha256 "$manifest")"
              ;;
            *)
              echo "unsupported Release manifest schema: $manifest_schema" >&2
              exit 1
              ;;
          esac

          [[ "$release_tag" == "$REQUESTED_TAG" ]] || { echo 'release manifest tag mismatch' >&2; exit 1; }
          [[ "$revision" == "$TAG_SHA" ]] || { echo 'release manifest/tag SHA mismatch' >&2; exit 1; }

          expected_artifact="$(jq -r .artifact.sha256 "$manifest")"
          actual_artifact="sha256:$(sha256sum "$artifact" | cut -d ' ' -f 1)"
          [[ "$actual_artifact" == "$expected_artifact" ]] || {
            echo 'Published Release artifact digest mismatch' >&2
            exit 1
          }

          expected_tag_message="$(pnpm exec tsx scripts/delivery/manifest.ts provenance \
            --file "$manifest")"
          tag_object="$(gh api "repos/$REPOSITORY/git/tags/$TAG_OBJECT_SHA")"
          actual_tag_message="$(jq -r .message <<<"$tag_object")"
          [[ "$actual_tag_message" == "$expected_tag_message" ]] || {
            echo 'annotated Release tag provenance does not match Published Release assets' >&2
            exit 1
          }

          {
            echo "revision=$revision"
            echo "release_tag=$release_tag"
            echo "release_digest=$release_digest"
            echo "manifest_schema=$manifest_schema"
            echo "knowledge_source_revision=$knowledge_source_revision"
            echo "knowledge_release_tag=$knowledge_release_tag"
            echo "knowledge_artifact_sha256=$knowledge_artifact_sha256"
            echo "knowledge_manifest_sha256=$knowledge_manifest_sha256"
            echo "public_infrastructure_source_revision=$public_infrastructure_source_revision"
            echo "public_infrastructure_release_tag=$public_infrastructure_release_tag"
            echo "public_infrastructure_artifact_sha256=$public_infrastructure_artifact_sha256"
            echo "public_infrastructure_manifest_sha256=$public_infrastructure_manifest_sha256"
            echo "private_infrastructure_source_revision=$private_infrastructure_source_revision"
            echo "private_infrastructure_contract_path=$private_infrastructure_contract_path"
            echo "private_infrastructure_sha256=$private_infrastructure_sha256"
          } >> "$GITHUB_OUTPUT"

      - name: Verify main ancestry and exact source workflow provenance
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_SHA: ${{ steps.identity.outputs.revision }}
        shell: bash
        run: |
          set -euo pipefail
          manifest=reports/deploy/release-manifest.json

          git fetch --quiet origin main --tags
          git merge-base --is-ancestor "$RELEASE_SHA" origin/main || {
            echo 'release SHA is not reachable from main' >&2
            exit 1
          }

          ci_run_id="$(jq -r .ciRunId "$manifest")"
          ci_json="$(gh api "repos/$REPOSITORY/actions/runs/$ci_run_id")"
          [[ "$(jq -r .name <<<"$ci_json")" == CI ]] || { echo 'release source run is not CI' >&2; exit 1; }
          [[ "$(jq -r .path <<<"$ci_json")" == .github/workflows/check.yml ]] || { echo 'CI workflow path mismatch' >&2; exit 1; }
          [[ "$(jq -r .event <<<"$ci_json")" =~ ^(push|workflow_dispatch)$ ]] || { echo 'release source CI trigger is not supported' >&2; exit 1; }
          [[ "$(jq -r .head_branch <<<"$ci_json")" == main ]] || { echo 'release source CI is not main' >&2; exit 1; }
          [[ "$(jq -r .head_sha <<<"$ci_json")" == "$RELEASE_SHA" ]] || { echo 'release source CI SHA mismatch' >&2; exit 1; }
          [[ "$(jq -r .conclusion <<<"$ci_json")" == success ]] || { echo 'release source CI did not succeed' >&2; exit 1; }

          candidate_run_id="$(jq -r .candidateRunId "$manifest")"
          candidate_json="$(gh api "repos/$REPOSITORY/actions/runs/$candidate_run_id")"
          [[ "$(jq -r .name <<<"$candidate_json")" == 'Publish Main Candidate' ]] || {
            echo 'release candidate run is not Publish Main Candidate' >&2
            exit 1
          }
          [[ "$(jq -r .conclusion <<<"$candidate_json")" == success ]] || {
            echo 'release candidate workflow did not succeed' >&2
            exit 1
          }

          # Candidate artifacts are retained for 90 days, but Published Releases must
          # remain deployable after that window. Long-lived integrity is anchored by
          # the annotated Release tag, which binds the complete Release manifest digest.

  deploy:
    name: Promote selected Release to Cloudflare production
    needs: verify-release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    environment:
      name: production
      url: ${{ steps.deploy.outputs.deployment-url }}
    steps:
      - name: Create short-lived Vault token
        id: vault-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.VAULT_APP_CLIENT_ID }}
          private-key: ${{ secrets.VAULT_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            digital-biome
            thought-forest
            personal-infrastructure
            personal-digital-system
          permission-contents: read

      - name: Checkout exact Release source
        uses: actions/checkout@v6
        with:
          token: ${{ steps.vault-token.outputs.token }}
          ref: ${{ needs.verify-release.outputs.revision }}
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout exact v4 Personal Infrastructure public projection source
        if: needs.verify-release.outputs.manifest_schema == 'digital-biome.release/v4'
        uses: actions/checkout@v6
        with:
          repository: BakerSean168/personal-infrastructure
          ssh-key: ${{ secrets.PERSONAL_INFRASTRUCTURE_DEPLOY_KEY }}
          ref: ${{ needs.verify-release.outputs.public_infrastructure_source_revision }}
          path: .pds-runtime/personal-infrastructure-public
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout exact private Personal Infrastructure runtime binding
        if: contains(fromJSON('["digital-biome.release/v5","digital-biome.release/v4","digital-biome.release/v3"]'), needs.verify-release.outputs.manifest_schema)
        uses: actions/checkout@v6
        with:
          repository: BakerSean168/personal-infrastructure
          ssh-key: ${{ secrets.PERSONAL_INFRASTRUCTURE_DEPLOY_KEY }}
          ref: ${{ needs.verify-release.outputs.private_infrastructure_source_revision }}
          path: .pds-runtime/personal-infrastructure
          fetch-depth: 1
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm

      - name: Install deployment tooling
        run: pnpm install --frozen-lockfile

      - name: Install v4 public infrastructure projection tooling
        if: needs.verify-release.outputs.manifest_schema == 'digital-biome.release/v4'
        run: python3 -m pip install --disable-pip-version-check -r .pds-runtime/personal-infrastructure-public/requirements-deployment-registry.txt

      - name: Download selected immutable Release assets
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.verify-release.outputs.release_tag }}
        run: |
          mkdir -p reports/deploy
          gh release download "$RELEASE_TAG" \
            --repo "$REPOSITORY" \
            --pattern release-manifest.json \
            --pattern digital-biome-pages.tar.gz \
            --dir reports/deploy

      - name: Revalidate knowledge projection and private deployment source
        env:
          GH_TOKEN: ${{ steps.vault-token.outputs.token }}
          MANIFEST_SCHEMA: ${{ needs.verify-release.outputs.manifest_schema }}
          KNOWLEDGE_SOURCE_REVISION: ${{ needs.verify-release.outputs.knowledge_source_revision }}
          KNOWLEDGE_RELEASE_TAG: ${{ needs.verify-release.outputs.knowledge_release_tag }}
          KNOWLEDGE_ARTIFACT_SHA256: ${{ needs.verify-release.outputs.knowledge_artifact_sha256 }}
          KNOWLEDGE_MANIFEST_SHA256: ${{ needs.verify-release.outputs.knowledge_manifest_sha256 }}
          PUBLIC_INFRASTRUCTURE_SOURCE_REVISION: ${{ needs.verify-release.outputs.public_infrastructure_source_revision }}
          PUBLIC_INFRASTRUCTURE_RELEASE_TAG: ${{ needs.verify-release.outputs.public_infrastructure_release_tag }}
          PUBLIC_INFRASTRUCTURE_ARTIFACT_SHA256: ${{ needs.verify-release.outputs.public_infrastructure_artifact_sha256 }}
          PUBLIC_INFRASTRUCTURE_MANIFEST_SHA256: ${{ needs.verify-release.outputs.public_infrastructure_manifest_sha256 }}
          PRIVATE_INFRASTRUCTURE_SOURCE_REVISION: ${{ needs.verify-release.outputs.private_infrastructure_source_revision }}
          PRIVATE_INFRASTRUCTURE_CONTRACT_PATH: ${{ needs.verify-release.outputs.private_infrastructure_contract_path }}
          PRIVATE_INFRASTRUCTURE_SHA256: ${{ needs.verify-release.outputs.private_infrastructure_sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          manifest=reports/deploy/release-manifest.json
          pnpm exec tsx scripts/delivery/manifest.ts validate --file "$manifest"

          case "$MANIFEST_SCHEMA" in
            digital-biome.release/v5)
              pnpm exec tsx scripts/delivery/revalidate.ts "$manifest" .pds-runtime/personal-infrastructure
              ;;
            digital-biome.release/v4|digital-biome.release/v3)
              knowledge_lock=data-products/knowledge-public-v1.lock.json
              private_lock=data-products/digital-biome-private-infrastructure-v1.lock.json
              private_root=.pds-runtime/personal-infrastructure

              [[ "$(jq -r .sourceRevision "$knowledge_lock")" == "$KNOWLEDGE_SOURCE_REVISION" ]]
              [[ "$(jq -r .releaseTag "$knowledge_lock")" == "$KNOWLEDGE_RELEASE_TAG" ]]
              [[ "$(jq -r .artifact.sha256 "$knowledge_lock")" == "$KNOWLEDGE_ARTIFACT_SHA256" ]]
              [[ "$(jq -r .manifest.sha256 "$knowledge_lock")" == "$KNOWLEDGE_MANIFEST_SHA256" ]]
              scripts/data-products/prepare-knowledge-public-v1.sh \
                --runtime-root .pds-runtime/knowledge-public-v1 \
                --lock "$knowledge_lock"
              knowledge_root=.pds-runtime/knowledge-public-v1/source
              {
                echo "NOTES_VAULT_ROOT=$knowledge_root"
                echo "NOTES_UPSTREAM_GENERATED=$knowledge_root/generated"
              } >> "$GITHUB_ENV"

              public_infra_artifact=''
              if [[ "$MANIFEST_SCHEMA" == 'digital-biome.release/v4' ]]; then
                public_infra_lock=data-products/infra-public-v2.lock.json
                [[ "$(jq -r .sourceRevision "$public_infra_lock")" == "$PUBLIC_INFRASTRUCTURE_SOURCE_REVISION" ]]
                [[ "$(jq -r .releaseTag "$public_infra_lock")" == "$PUBLIC_INFRASTRUCTURE_RELEASE_TAG" ]]
                [[ "$(jq -r .artifact.sha256 "$public_infra_lock")" == "$PUBLIC_INFRASTRUCTURE_ARTIFACT_SHA256" ]]
                [[ "$(jq -r .manifest.sha256 "$public_infra_lock")" == "$PUBLIC_INFRASTRUCTURE_MANIFEST_SHA256" ]]
                scripts/data-products/prepare-infra-public-v2.sh \
                  --runtime-root .pds-runtime/infra-public-v2 \
                  --lock "$public_infra_lock" \
                  --producer-root .pds-runtime/personal-infrastructure-public
                public_infra_artifact=src/data/infrastructure/infra-public-v2.json
                echo "PDS_PUBLIC_INFRASTRUCTURE_ARTIFACT=$public_infra_artifact" >> "$GITHUB_ENV"
              fi

              [[ "$(jq -r .producerRepository "$private_lock")" == 'BakerSean168/personal-infrastructure' ]]
              [[ "$(jq -r .sourceRevision "$private_lock")" == "$PRIVATE_INFRASTRUCTURE_SOURCE_REVISION" ]]
              [[ "$(jq -r .contractPath "$private_lock")" == "$PRIVATE_INFRASTRUCTURE_CONTRACT_PATH" ]]
              [[ "$(jq -r .sha256 "$private_lock")" == "$PRIVATE_INFRASTRUCTURE_SHA256" ]]

              actual_private_sha="$(git -C "$private_root" rev-parse HEAD)"
              [[ "$actual_private_sha" == "$PRIVATE_INFRASTRUCTURE_SOURCE_REVISION" ]] || {
                echo 'Personal Infrastructure checkout does not match the Release runtime binding revision' >&2
                exit 1
              }

              contract_path="$private_root/$PRIVATE_INFRASTRUCTURE_CONTRACT_PATH"
              test -s "$contract_path"
              actual_contract_sha256="sha256:$(sha256sum "$contract_path" | cut -d ' ' -f 1)"
              [[ "$actual_contract_sha256" == "$PRIVATE_INFRASTRUCTURE_SHA256" ]] || {
                echo 'Personal Infrastructure runtime binding digest mismatch' >&2
                exit 1
              }

              echo "PDS_PRIVATE_INFRASTRUCTURE_BINDING=$contract_path" >> "$GITHUB_ENV"
              NOTES_VAULT_ROOT="$knowledge_root" \
                NOTES_UPSTREAM_GENERATED="$knowledge_root/generated" \
                PDS_PRIVATE_INFRASTRUCTURE_BINDING="$contract_path" \
                PDS_PUBLIC_INFRASTRUCTURE_ARTIFACT="$public_infra_artifact" \
                pnpm exec tsx --test scripts/private-infrastructure-binding.test.ts
              ;;
            *)
              echo "unsupported Release manifest schema: $MANIFEST_SCHEMA" >&2
              exit 1
              ;;
          esac

          # Private source work above regenerates only deployment inputs and validates
          # contracts. It never rebuilds the immutable public Pages artifact.

      - name: Verify and unpack immutable Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          manifest=reports/deploy/release-manifest.json
          artifact=reports/deploy/digital-biome-pages.tar.gz

          expected="$(jq -r .artifact.sha256 "$manifest")"
          actual="sha256:$(sha256sum "$artifact" | cut -d ' ' -f 1)"
          [[ "$actual" == "$expected" ]]

          if tar -tzf "$artifact" | grep -Eq '(^/|(^|/)\.\.(/|$))'; then
            echo 'release archive contains unsafe path entries' >&2
            exit 1
          fi

          mkdir release-package
          tar -xzf "$artifact" -C release-package
          test -s release-package/dist/_worker.js
          test -s release-package/dist/_routes.json

      - name: Validate production observability credentials
        shell: bash
        env:
          AI_USAGE_HUB_URL: ${{ secrets.AI_USAGE_HUB_URL }}
          AI_USAGE_HUB_READ_KEY: ${{ secrets.AI_USAGE_HUB_READ_KEY }}
        run: |
          set -euo pipefail
          test -n "$AI_USAGE_HUB_URL"
          test -n "$AI_USAGE_HUB_READ_KEY"

      - name: Generate and update encrypted Pages bindings
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          AI_USAGE_HUB_URL: ${{ secrets.AI_USAGE_HUB_URL }}
          AI_USAGE_HUB_READ_KEY: ${{ secrets.AI_USAGE_HUB_READ_KEY }}
          MANIFEST_SCHEMA: ${{ needs.verify-release.outputs.manifest_schema }}
        run: |
          set -euo pipefail
          payload_file="${RUNNER_TEMP}/private-infrastructure.json"
          case "$MANIFEST_SCHEMA" in
            digital-biome.release/v5|digital-biome.release/v4|digital-biome.release/v3)
              test -n "${PDS_PRIVATE_INFRASTRUCTURE_BINDING:-}"
              pnpm export:private -- \
                --contract "$PDS_PRIVATE_INFRASTRUCTURE_BINDING" \
                --out "$payload_file"
              ;;
            *)
              echo "unsupported Release manifest schema: $MANIFEST_SCHEMA" >&2
              exit 1
              ;;
          esac
          pnpm exec wrangler pages secret put PRIVATE_INFRASTRUCTURE_JSON \
            --project-name digital-biome < "$payload_file"
          printf '%s' "$AI_USAGE_HUB_URL" | pnpm exec wrangler pages secret put AI_USAGE_HUB_URL \
            --project-name digital-biome
          printf '%s' "$AI_USAGE_HUB_READ_KEY" | pnpm exec wrangler pages secret put AI_USAGE_HUB_READ_KEY \
            --project-name digital-biome

      - name: Deploy selected immutable artifact
        id: deploy
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          wranglerVersion: 4.111.0
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          workingDirectory: release-package
          command: >-
            pages deploy dist
            --project-name digital-biome
            --branch main
            --commit-hash ${{ needs.verify-release.outputs.revision }}
            --commit-dirty=false
            --no-bundle

      - name: Record Cloudflare deployment identity
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          set -euo pipefail
          deployments_file="${RUNNER_TEMP}/pages-deployments.json"
          pnpm wrangler pages deployment list \
            --project-name digital-biome \
            --environment production \
            --json > "$deployments_file"

          deployment_id="$(jq -r --arg url "$DEPLOYMENT_URL" \
            '[.[] | select(.Deployment == $url)][0].Id // empty' "$deployments_file")"
          test -n "$deployment_id"

          jq \
            --arg deployment_id "$deployment_id" \
            --arg deployment_url "$DEPLOYMENT_URL" \
            '. + {deployment:{id:$deployment_id,url:$deployment_url}}' \
            reports/deploy/release-manifest.json > deployment-result.json

      - name: Upload production deployment record
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-pages-production-${{ needs.verify-release.outputs.revision }}
          path: deployment-result.json
          if-no-files-found: error
          retention-days: 90

      - name: Smoke test public note detail
        shell: bash
        env:
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL || 'https://digital-biome.pages.dev' }}
        run: |
          set -euo pipefail
          public_note_file="$(find release-package/dist/notes/obsidian -type f -name index.html -print -quit)"
          test -n "$public_note_file"
          public_note="${public_note_file#release-package/dist}"
          public_note="${public_note%index.html}"
          public_note="$(node -e 'process.stdout.write(process.argv[1].split("/").map(encodeURIComponent).join("/"))' "$public_note")"
          curl --fail --silent --show-error --location --retry 5 --retry-all-errors \
            "$PRODUCTION_URL${public_note}?ui=gui" > /dev/null

      - name: Smoke test public site and telemetry contracts
        shell: bash
        env:
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL || 'https://digital-biome.pages.dev' }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 5 --retry-all-errors \
            "$PRODUCTION_URL/" > /dev/null


          ai_usage_file="$(mktemp)"
          servers_file="$(mktemp)"
          headers="$(mktemp)"
          trap 'rm -f "$ai_usage_file" "$servers_file" "$headers"' EXIT

          wait_for_contract() {
            local url="$1"
            local output_file="$2"
            local contract="$3"
            local label="$4"

            for attempt in $(seq 1 12); do
              if curl --fail --silent --show-error --location --retry 2 --retry-all-errors \
                  "$url" > "$output_file" &&
                jq -e "$contract" "$output_file" > /dev/null; then
                return 0
              fi

              if [ "$attempt" -eq 12 ]; then
                echo "$label contract did not propagate after $attempt attempts" >&2
                jq . "$output_file" >&2 || true
                return 1
              fi
              sleep 5
            done
          }

          wait_for_contract \
            "$PRODUCTION_URL/api/ai-usage" \
            "$ai_usage_file" \
            '(.totalTokens7d | type == "number") and
             (.estimatedCost7d | type == "number") and
             (.tools | type == "array") and
             (.byMachine.local.tokens7d | type == "number") and
             (.byMachine.local.costUsd7d | type == "number") and
             (.byMachine.hermes.tokens7d | type == "number") and
             (.byMachine.hermes.costUsd7d | type == "number") and
             (.periods["1d"].machines.local.agents | type == "array") and
             (.periods["7d"].machines.hermes.models | type == "array") and
             (.periods["30d"].totalTokens | type == "number") and
             (.periods.all.totalTokens | type == "number") and
             (.periods.all.totalCostUsd | type == "number") and
             (.periods.all.machines.local.agents | type == "array") and
             (.periods.all.machines.hermes.models | type == "array") and
             (.periods.all.coverage.startDate | type == "string") and
             (.periods.all.coverage.endDate | type == "string") and
             (.periods.all.coverage.activeDays | type == "number")' \
            'AI usage API'

          wait_for_contract \
            "$PRODUCTION_URL/api/servers" \
            "$servers_file" \
            '(.total | type == "number") and
             (.online | type == "number") and
             (.servers | type == "array" and length > 0) and
             (all(.servers[]; .online | type == "boolean"))' \
            'Servers API'

          status="$(curl --silent --dump-header "$headers" --output /dev/null \
            --write-out '%{http_code}' \
            "$PRODUCTION_URL/api/private/infrastructure")"
          case "$status" in
            401|403) ;;
            302)
              grep --ignore-case --quiet '^www-authenticate: cloudflare-access' "$headers"
              grep --ignore-case --quiet \
                '^location: https://[^/]*\.cloudflareaccess\.com/cdn-cgi/access/login/' \
                "$headers"
              ;;
            *)
              echo "Protected API returned unexpected HTTP $status" >&2
              exit 1
              ;;
          esac

      - name: Record production promotion
        env:
          RELEASE_TAG: ${{ needs.verify-release.outputs.release_tag }}
          RELEASE_SHA: ${{ needs.verify-release.outputs.revision }}
          RELEASE_DIGEST: ${{ needs.verify-release.outputs.release_digest }}
        run: |
          {
            echo '### Production Release selected'
            echo
            echo "- Release: $RELEASE_TAG"
            echo "- Revision: $RELEASE_SHA"
            echo "- Release manifest: $RELEASE_DIGEST"
            echo '- Deployable application artifact was promoted without rebuild.'
          } >> "$GITHUB_STEP_SUMMARY"
