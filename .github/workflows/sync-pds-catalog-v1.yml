name: Reconcile pds-catalog-v1 (manual alias)

# Legacy source-copy writer retired. PR #120 is superseded only after independent review.
on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  reconcile:
    uses: ./.github/workflows/sync-data-products.yml
    with:
      product: pds-catalog-v1
      reconcile: true
    secrets: inherit
