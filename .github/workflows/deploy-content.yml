name: Deploy Content

on:
  workflow_run:
    workflows: ['Publish Main Candidate']
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: Successful immutable Candidate workflow run to resume
        required: true
        type: string

# Serialize against manual application production promotion as well.
concurrency:
  group: production-release-selection
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  resolve:
    if: >-
      vars.CONTENT_AUTO_DEPLOY_ENABLED == 'true' &&
      (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    outputs:
      eligible: ${{ steps.candidate.outputs.eligible }}
      revision: ${{ steps.candidate.outputs.revision }}
      artifact_name: ${{ steps.candidate.outputs.artifact_name }}
      private_revision: ${{ steps.candidate.outputs.private_revision }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Verify Candidate source, CI, archive and public lock-only change
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_RUN_ID: ${{ github.event.workflow_run.id || inputs.candidate_run_id }}
        run: pnpm exec tsx scripts/delivery/content-candidate.ts resolve

  deploy:
    needs: resolve
    if: needs.resolve.outputs.eligible == 'true'
    runs-on: ubuntu-latest
    environment:
      name: production-content
      url: ${{ steps.deploy.outputs.deployment-url }}
    permissions:
      contents: read
      actions: read
      deployments: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve.outputs.revision }}
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id || inputs.candidate_run_id }}
          name: ${{ needs.resolve.outputs.artifact_name }}
          path: reports/content
      - name: Verify the current production source contains no unreleased application changes
        id: baseline
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
          curl --fail --silent --show-error --max-time 30 \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/digital-biome" \
            > "$RUNNER_TEMP/content-baseline.json"
          pnpm exec tsx scripts/delivery/content-candidate.ts baseline "$RUNNER_TEMP/content-baseline.json"
      - name: Create short-lived public data product reader
        if: steps.baseline.outputs.eligible == 'true'
        id: reader
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.VAULT_APP_CLIENT_ID }}
          private-key: ${{ secrets.VAULT_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            digital-biome
            thought-forest
            personal-infrastructure
            personal-digital-system
          permission-contents: read
      - name: Checkout exact private binding for reference coverage only
        if: steps.baseline.outputs.eligible == 'true'
        uses: actions/checkout@v6
        with:
          repository: BakerSean168/personal-infrastructure
          ssh-key: ${{ secrets.PERSONAL_INFRASTRUCTURE_DEPLOY_KEY }}
          ref: ${{ needs.resolve.outputs.private_revision }}
          path: .pds-runtime/personal-infrastructure
          persist-credentials: false
      - name: Revalidate all public locks, binding coverage and immutable archive
        if: steps.baseline.outputs.eligible == 'true'
        env:
          GH_TOKEN: ${{ steps.reader.outputs.token }}
          EXPECTED_SHA: ${{ needs.resolve.outputs.revision }}
        run: |
          set -euo pipefail
          manifest=reports/content/reports/candidate/candidate-manifest.json
          archive=reports/content/digital-biome-pages.tar.gz
          pnpm exec tsx scripts/delivery/revalidate.ts "$manifest" .pds-runtime/personal-infrastructure
          test "$(jq -r .gitSha "$manifest")" = "$EXPECTED_SHA"
          test "$(jq -r .artifact.sha256 "$manifest")" = "sha256:$(sha256sum "$archive" | cut -d ' ' -f 1)"
          test "$(jq -r .artifact.bytes "$manifest")" = "$(stat -c '%s' "$archive")"
          if tar -tzf "$archive" | grep -Eq '(^/|(^|/)\.\.(/|$))'; then
            echo 'Unsafe archive path' >&2
            exit 1
          fi
          mkdir release-package
          tar -xzf "$archive" -C release-package
          test -s release-package/dist/_worker.js
          test -s release-package/dist/_routes.json
      - name: Recheck main and production immediately before mutation
        if: steps.baseline.outputs.eligible == 'true'
        id: freshness
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ needs.resolve.outputs.revision }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          main_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)"
          if [ "$main_sha" != "$EXPECTED_SHA" ]; then
            echo 'eligible=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          curl --fail --silent --show-error --max-time 30 \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/digital-biome" \
            > "$RUNNER_TEMP/content-baseline.json"
          pnpm exec tsx scripts/delivery/content-candidate.ts baseline "$RUNNER_TEMP/content-baseline.json"
      - name: Promote the verified content artifact without rebuilding
        if: steps.freshness.outputs.eligible == 'true'
        id: deploy
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          wranglerVersion: 4.111.0
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ github.token }}
          workingDirectory: release-package
          command: >-
            pages deploy dist
            --project-name digital-biome
            --branch main
            --commit-hash ${{ needs.resolve.outputs.revision }}
            --commit-dirty=false
            --no-bundle
      - name: Record exact content deployment provenance
        id: record
        if: steps.freshness.outputs.eligible == 'true'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          set -euo pipefail
          pnpm exec wrangler pages deployment list --project-name digital-biome --environment production --json > "$RUNNER_TEMP/content-deployments.json"
          id="$(jq -r --arg url "$DEPLOYMENT_URL" '[.[] | select(.Deployment == $url)][0].Id // empty' "$RUNNER_TEMP/content-deployments.json")"
          test -n "$id"
          jq --arg id "$id" --arg url "$DEPLOYMENT_URL" \
            '. + {deployment:{id:$id,url:$url,lane:"content"}}' \
            reports/content/reports/candidate/candidate-manifest.json > content-deployment-result.json
      - name: Verify public pages and protected boundary
        id: smoke
        if: steps.freshness.outputs.eligible == 'true'
        env:
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL || 'https://bakersean.top' }}
        run: |
          set -euo pipefail
          for route in / /notes /tools /systems; do
            curl --fail --silent --show-error --location --retry 5 --retry-all-errors --max-time 30 \
              "$PRODUCTION_URL$route" > /dev/null
          done
          status="$(curl --silent --show-error --max-time 30 --dump-header "$RUNNER_TEMP/private-headers" --output /dev/null --write-out '%{http_code}' "$PRODUCTION_URL/api/private/infrastructure")"
          case "$status" in
            401|403) ;;
            302)
              grep -iq '^www-authenticate: cloudflare-access' "$RUNNER_TEMP/private-headers"
              grep -iEq '^location: https://[^/]*\.cloudflareaccess\.com/cdn-cgi/access/login/' "$RUNNER_TEMP/private-headers"
              ;;
            *) echo 'Protected API boundary failed' >&2; exit 1 ;;
          esac
      - name: Retain deployment identity and smoke outcome even on failure
        if: always() && steps.record.outcome == 'success'
        env:
          SMOKE_OUTCOME: ${{ steps.smoke.outcome }}
        run: |
          jq --arg outcome "$SMOKE_OUTCOME" '. + {smokeOutcome:$outcome}' content-deployment-result.json > content-deployment-evidence.json
      - uses: actions/upload-artifact@v4
        if: always() && steps.record.outcome == 'success'
        with:
          name: content-production-${{ needs.resolve.outputs.revision }}
          path: content-deployment-evidence.json
          if-no-files-found: error
