name: Type Check

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'tsconfig.json'
      - 'package.json'
      - 'pnpm-lock.yaml'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'tsconfig.json'
      - 'package.json'
      - 'pnpm-lock.yaml'

concurrency:
  group: type-check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Create short-lived Vault token
        id: vault-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.VAULT_APP_CLIENT_ID }}
          private-key: ${{ secrets.VAULT_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            digital-biome
            thought-forest
          permission-contents: read

      - name: Checkout
        uses: actions/checkout@v6
        with:
          token: ${{ steps.vault-token.outputs.token }}
          submodules: recursive
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Vault index dependencies
        run: npm --prefix thought-forest ci --ignore-scripts

      - name: Build and sync the pinned Vault
        run: pnpm sync

      - name: Run astro check
        run: pnpm check

      - name: Check Pages Functions
        run: pnpm check:edge

      - name: Test infrastructure contracts
        run: pnpm test:infrastructure
