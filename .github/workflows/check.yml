name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'edge/**'
      - 'functions/**'
      - 'scripts/**'
      - 'e2e/**'
      - 'playwright.config.ts'
      - 'tsconfig.json'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'release-please-config.json'
      - '.release-please-manifest.json'
      - 'biome.json'
      - 'prettier.config.mjs'
      - 'astro.config.mjs'
      - 'notes.config.ts'
      - '.github/workflows/**'
      - 'data-products/**'
      - 'thought-forest'
      - 'docs/**'
      - 'AGENTS.md'
      - '.github/workflows/check.yml'
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Create short-lived knowledge product token
        id: vault-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.VAULT_APP_CLIENT_ID }}
          private-key: ${{ secrets.VAULT_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            digital-biome
            thought-forest
          permission-contents: read

      - name: Checkout
        uses: actions/checkout@v6
        with:
          token: ${{ steps.vault-token.outputs.token }}
          persist-credentials: false

      - id: public-infra-lock
        name: Resolve pinned public infrastructure revision
        shell: bash
        run: |
          set -euo pipefail
          revision="$(jq -r .sourceRevision data-products/infra-public-v2.lock.json)"
          [[ "$revision" =~ ^[0-9a-f]{40}$ ]]
          echo "revision=$revision" >> "$GITHUB_OUTPUT"

      - name: Checkout pinned Personal Infrastructure projection source
        uses: actions/checkout@v6
        with:
          repository: BakerSean168/personal-infrastructure
          ssh-key: ${{ secrets.PDS_INFRA_PUBLIC_DEPLOY_KEY }}
          ref: ${{ steps.public-infra-lock.outputs.revision }}
          path: .pds-runtime/personal-infrastructure-public
          fetch-depth: 1
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install public infrastructure projection tooling
        run: python3 -m pip install --disable-pip-version-check -r .pds-runtime/personal-infrastructure-public/requirements-deployment-registry.txt

      - name: Fetch and materialize pinned knowledge-public-v1
        env:
          GH_TOKEN: ${{ steps.vault-token.outputs.token }}
        run: scripts/data-products/prepare-knowledge-public-v1.sh

      - name: Build and materialize pinned infra-public-v2
        run: scripts/data-products/prepare-infra-public-v2.sh --producer-root .pds-runtime/personal-infrastructure-public

      - name: Run verification and production build gates
        env:
          NOTES_VAULT_ROOT: ${{ github.workspace }}/.pds-runtime/knowledge-public-v1/source
          NOTES_UPSTREAM_GENERATED: ${{ github.workspace }}/.pds-runtime/knowledge-public-v1/source/generated
        run: pnpm verify:full

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run focused browser E2E
        run: pnpm test:e2e
