name: Sync infra-public-v2

on:
  repository_dispatch:
    types:
      - infra-public-v2-published
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact Personal Infrastructure source revision to pin
        required: false
        type: string
  schedule:
    - cron: '17 */6 * * *'

concurrency:
  group: sync-infra-public-v2
  cancel-in-progress: false

permissions:
  actions: write
  contents: write
  pull-requests: write

env:
  SYNC_BRANCH: automation/infra-public-v2-sync
  PRODUCER_REPOSITORY: BakerSean168/personal-infrastructure

jobs:
  sync-source:
    runs-on: ubuntu-latest
    steps:
      - name: Create short-lived producer read token
        id: producer-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.VAULT_APP_CLIENT_ID }}
          private-key: ${{ secrets.VAULT_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            digital-biome
            personal-infrastructure
          permission-contents: read

      - name: Checkout Digital Biome main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - id: target
        name: Resolve immutable producer identity
        shell: bash
        env:
          GH_TOKEN: ${{ steps.producer-token.outputs.token }}
          DISPATCH_SHA: ${{ github.event.client_payload.sha }}
          DISPATCH_RELEASE_TAG: ${{ github.event.client_payload.release_tag }}
          DISPATCH_ARTIFACT_SHA256: ${{ github.event.client_payload.artifact_sha256 }}
          DISPATCH_MANIFEST_SHA256: ${{ github.event.client_payload.manifest_sha256 }}
          INPUT_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail

          source_sha="${INPUT_SHA:-${DISPATCH_SHA:-}}"
          if [ -z "$source_sha" ]; then
            source_sha="$(gh api "repos/$PRODUCER_REPOSITORY/commits/main" --jq .sha)"
          fi
          [[ "$source_sha" =~ ^[0-9a-f]{40}$ ]] || {
            echo "source SHA must be a full lowercase Git SHA" >&2
            exit 1
          }

          release_tag="${DISPATCH_RELEASE_TAG:-infra-public-v2-$source_sha}"
          [[ "$release_tag" == "infra-public-v2-$source_sha" ]] || {
            echo "release tag does not match source revision" >&2
            exit 1
          }

          {
            echo "source_sha=$source_sha"
            echo "release_tag=$release_tag"
            echo "dispatch_artifact_sha256=${DISPATCH_ARTIFACT_SHA256:-}"
            echo "dispatch_manifest_sha256=${DISPATCH_MANIFEST_SHA256:-}"
          } >> "$GITHUB_OUTPUT"

      - id: projection
        name: Download and verify immutable producer Release
        shell: bash
        env:
          GH_TOKEN: ${{ steps.producer-token.outputs.token }}
          SOURCE_SHA: ${{ steps.target.outputs.source_sha }}
          RELEASE_TAG: ${{ steps.target.outputs.release_tag }}
          DISPATCH_ARTIFACT_SHA256: ${{ steps.target.outputs.dispatch_artifact_sha256 }}
          DISPATCH_MANIFEST_SHA256: ${{ steps.target.outputs.dispatch_manifest_sha256 }}
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT

          gh release download "$RELEASE_TAG"             --repo "$PRODUCER_REPOSITORY"             --pattern infra-public-v2.json             --pattern infra-public-v2.manifest.json             --dir "$tmp"

          artifact_sha256="sha256:$(sha256sum "$tmp/infra-public-v2.json" | cut -d ' ' -f 1)"
          manifest_sha256="sha256:$(sha256sum "$tmp/infra-public-v2.manifest.json" | cut -d ' ' -f 1)"

          [[ "$(jq -r .source.revision "$tmp/infra-public-v2.json")" == "$SOURCE_SHA" ]]
          [[ "$(jq -r .spec.source.revision "$tmp/infra-public-v2.manifest.json")" == "$SOURCE_SHA" ]]
          [[ "$(jq -r .product "$tmp/infra-public-v2.json")" == 'infra-public-v2' ]]
          [[ "$(jq -r .metadata.id "$tmp/infra-public-v2.manifest.json")" == 'infra-public-v2' ]]

          if [ -n "$DISPATCH_ARTIFACT_SHA256" ]; then
            [[ "$artifact_sha256" == "$DISPATCH_ARTIFACT_SHA256" ]]
          fi
          if [ -n "$DISPATCH_MANIFEST_SHA256" ]; then
            [[ "$manifest_sha256" == "$DISPATCH_MANIFEST_SHA256" ]]
          fi

          {
            echo "artifact_sha256=$artifact_sha256"
            echo "manifest_sha256=$manifest_sha256"
          } >> "$GITHUB_OUTPUT"

      - id: lock
        name: Build next consumer lock
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.target.outputs.source_sha }}
          RELEASE_TAG: ${{ steps.target.outputs.release_tag }}
          ARTIFACT_SHA256: ${{ steps.projection.outputs.artifact_sha256 }}
          MANIFEST_SHA256: ${{ steps.projection.outputs.manifest_sha256 }}
        run: |
          set -euo pipefail
          next_lock="$RUNNER_TEMP/infra-public-v2.lock.json"
          jq -n             --arg sourceRevision "$SOURCE_SHA"             --arg releaseTag "$RELEASE_TAG"             --arg artifactSha256 "$ARTIFACT_SHA256"             --arg manifestSha256 "$MANIFEST_SHA256"             '{
              schemaVersion: 1,
              product: "infra-public-v2",
              producerRepository: "BakerSean168/personal-infrastructure",
              sourceRevision: $sourceRevision,
              releaseTag: $releaseTag,
              artifact: {
                name: "infra-public-v2.json",
                sha256: $artifactSha256
              },
              manifest: {
                name: "infra-public-v2.manifest.json",
                sha256: $manifestSha256
              }
            }' > "$next_lock"

          if [ -f data-products/infra-public-v2.lock.json ] &&
             cmp -s data-products/infra-public-v2.lock.json "$next_lock"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
          echo "path=$next_lock" >> "$GITHUB_OUTPUT"

      - name: Commit and push fixed sync branch
        if: steps.lock.outputs.changed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_SHA: ${{ steps.target.outputs.source_sha }}
          NEXT_LOCK: ${{ steps.lock.outputs.path }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git switch -C "$SYNC_BRANCH" origin/main
          mkdir -p data-products
          cp "$NEXT_LOCK" data-products/infra-public-v2.lock.json

          git add data-products/infra-public-v2.lock.json
          git commit -m "chore(data): pin infra-public-v2 to ${SOURCE_SHA:0:12}"
          gh auth setup-git
          git push --force --set-upstream origin "$SYNC_BRANCH"

      - name: Open PR if not already open
        if: steps.lock.outputs.changed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_SHA: ${{ steps.target.outputs.source_sha }}
        run: |
          set -euo pipefail
          open_pr="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$SYNC_BRANCH" --state open --json number --jq '.[0].number // empty')"
          if [ -n "$open_pr" ]; then
            echo "infra-public-v2 sync PR #$open_pr updated in place."
          else
            gh pr create               --base main               --head "$SYNC_BRANCH"               --title "chore(data): update infra-public-v2 to ${SOURCE_SHA:0:12}"               --body "Pins the immutable Personal Infrastructure infra-public-v2 projection to source revision `$SOURCE_SHA`. Digital Biome renders infrastructure facts from this producer-owned contract; protected values remain in the separate RuntimeBinding."
          fi

      - name: Approve and wait for protected PR CI when required
        if: steps.lock.outputs.changed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          head_sha="$(git rev-parse HEAD)"
          run_id=''
          conclusion=''

          for attempt in $(seq 1 20); do
            run_json="$(gh run list               --repo "$GITHUB_REPOSITORY"               --workflow check.yml               --branch "$SYNC_BRANCH"               --event pull_request               --limit 10               --json databaseId,headSha,status,conclusion)"
            run_id="$(jq -r --arg sha "$head_sha" '[.[] | select(.headSha == $sha)][0].databaseId // empty' <<<"$run_json")"
            conclusion="$(jq -r --arg sha "$head_sha" '[.[] | select(.headSha == $sha)][0].conclusion // empty' <<<"$run_json")"
            [ -n "$run_id" ] && break
            sleep 2
          done

          test -n "$run_id" || {
            echo 'protected pull_request CI run did not appear for the generated sync commit' >&2
            exit 1
          }

          if [ "$conclusion" = action_required ]; then
            gh api -X POST "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/approve" > /dev/null
          fi

          gh run watch "$run_id" --repo "$GITHUB_REPOSITORY" --exit-status

      - name: Report no-op
        if: steps.lock.outputs.changed != 'true'
        run: echo "infra-public-v2 lock already points to the latest producer Release."
