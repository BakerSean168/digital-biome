name: Sync infra-public-v2 (manual reconciliation alias)

# The old producer event is retired here. Until Protocol-v1 producer activation,
# the shared scheduled reconciliation recovers missed/legacy notifications.
on:
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pull-requests: write

jobs:
  reconcile:
    uses: ./.github/workflows/sync-data-products.yml
    with:
      product: infra-public-v2
      reconcile: true
    secrets: inherit
