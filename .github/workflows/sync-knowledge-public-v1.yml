name: Sync knowledge-public-v1

on:
  repository_dispatch:
    types:
      - knowledge-public-v1-published
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact Thought Forest source revision to pin
        required: true
        type: string

concurrency:
  group: sync-knowledge-public-v1
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

env:
  SYNC_BRANCH: automation/knowledge-public-v1-sync
  PRODUCER_REPOSITORY: BakerSean168/thought-forest

jobs:
  sync-source:
    runs-on: ubuntu-latest
    steps:
      - name: Create short-lived producer read token
        id: producer-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.VAULT_APP_CLIENT_ID }}
          private-key: ${{ secrets.VAULT_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            digital-biome
            thought-forest
          permission-contents: read

      - name: Checkout Digital Biome main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - id: target
        name: Resolve immutable producer identity
        shell: bash
        env:
          DISPATCH_SHA: ${{ github.event.client_payload.sha }}
          DISPATCH_RELEASE_TAG: ${{ github.event.client_payload.release_tag }}
          DISPATCH_ARTIFACT_SHA256: ${{ github.event.client_payload.artifact_sha256 }}
          DISPATCH_MANIFEST_SHA256: ${{ github.event.client_payload.manifest_sha256 }}
          INPUT_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail

          source_sha="${INPUT_SHA:-${DISPATCH_SHA:-}}"
          [[ "$source_sha" =~ ^[0-9a-f]{40}$ ]] || {
            echo "source SHA must be a full lowercase Git SHA" >&2
            exit 1
          }

          release_tag="${DISPATCH_RELEASE_TAG:-knowledge-public-v1-$source_sha}"
          [[ "$release_tag" == "knowledge-public-v1-$source_sha" ]] || {
            echo "release tag does not match source revision" >&2
            exit 1
          }

          {
            echo "source_sha=$source_sha"
            echo "release_tag=$release_tag"
            echo "dispatch_artifact_sha256=${DISPATCH_ARTIFACT_SHA256:-}"
            echo "dispatch_manifest_sha256=${DISPATCH_MANIFEST_SHA256:-}"
          } >> "$GITHUB_OUTPUT"

      - id: projection
        name: Download and verify immutable producer Release
        shell: bash
        env:
          GH_TOKEN: ${{ steps.producer-token.outputs.token }}
          SOURCE_SHA: ${{ steps.target.outputs.source_sha }}
          RELEASE_TAG: ${{ steps.target.outputs.release_tag }}
          DISPATCH_ARTIFACT_SHA256: ${{ steps.target.outputs.dispatch_artifact_sha256 }}
          DISPATCH_MANIFEST_SHA256: ${{ steps.target.outputs.dispatch_manifest_sha256 }}
        run: |
          set -euo pipefail

          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT

          gh release download "$RELEASE_TAG"             --repo "$PRODUCER_REPOSITORY"             --pattern knowledge-public-v1.json             --pattern knowledge-public-v1.manifest.json             --dir "$tmp"

          artifact_sha256="sha256:$(sha256sum "$tmp/knowledge-public-v1.json" | cut -d ' ' -f 1)"
          manifest_sha256="sha256:$(sha256sum "$tmp/knowledge-public-v1.manifest.json" | cut -d ' ' -f 1)"

          [[ "$(jq -r .source.revision "$tmp/knowledge-public-v1.json")" == "$SOURCE_SHA" ]] || {
            echo "projection source revision mismatch" >&2
            exit 1
          }
          [[ "$(jq -r .spec.source.revision "$tmp/knowledge-public-v1.manifest.json")" == "$SOURCE_SHA" ]] || {
            echo "producer manifest source revision mismatch" >&2
            exit 1
          }

          if [ -n "$DISPATCH_ARTIFACT_SHA256" ]; then
            [[ "$artifact_sha256" == "$DISPATCH_ARTIFACT_SHA256" ]] || {
              echo "dispatch artifact digest mismatch" >&2
              exit 1
            }
          fi
          if [ -n "$DISPATCH_MANIFEST_SHA256" ]; then
            [[ "$manifest_sha256" == "$DISPATCH_MANIFEST_SHA256" ]] || {
              echo "dispatch manifest digest mismatch" >&2
              exit 1
            }
          fi

          {
            echo "artifact_sha256=$artifact_sha256"
            echo "manifest_sha256=$manifest_sha256"
          } >> "$GITHUB_OUTPUT"

      - id: lock
        name: Build next consumer lock
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.target.outputs.source_sha }}
          RELEASE_TAG: ${{ steps.target.outputs.release_tag }}
          ARTIFACT_SHA256: ${{ steps.projection.outputs.artifact_sha256 }}
          MANIFEST_SHA256: ${{ steps.projection.outputs.manifest_sha256 }}
        run: |
          set -euo pipefail

          next_lock="$RUNNER_TEMP/knowledge-public-v1.lock.json"
          jq -n             --arg sourceRevision "$SOURCE_SHA"             --arg releaseTag "$RELEASE_TAG"             --arg artifactSha256 "$ARTIFACT_SHA256"             --arg manifestSha256 "$MANIFEST_SHA256"             '{
              schemaVersion: 1,
              product: "knowledge-public-v1",
              producerRepository: "BakerSean168/thought-forest",
              sourceRevision: $sourceRevision,
              releaseTag: $releaseTag,
              artifact: {
                name: "knowledge-public-v1.json",
                sha256: $artifactSha256
              },
              manifest: {
                name: "knowledge-public-v1.manifest.json",
                sha256: $manifestSha256
              }
            }' > "$next_lock"

          current_source_sha="$(git ls-tree HEAD thought-forest | awk '{print $3}')"
          if [ -f data-products/knowledge-public-v1.lock.json ] &&
             cmp -s data-products/knowledge-public-v1.lock.json "$next_lock" &&
             [ "$current_source_sha" = "$SOURCE_SHA" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
          echo "path=$next_lock" >> "$GITHUB_OUTPUT"

      - name: Commit and push fixed sync branch
        if: steps.lock.outputs.changed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRODUCER_TOKEN: ${{ steps.producer-token.outputs.token }}
          SOURCE_SHA: ${{ steps.target.outputs.source_sha }}
          NEXT_LOCK: ${{ steps.lock.outputs.path }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git switch -C "$SYNC_BRANCH" origin/main
          mkdir -p data-products
          cp "$NEXT_LOCK" data-products/knowledge-public-v1.lock.json

          auth_header="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$PRODUCER_TOKEN" | base64 -w0)"
          git -c http.https://github.com/.extraheader="$auth_header" submodule update --init thought-forest
          git -C thought-forest -c http.https://github.com/.extraheader="$auth_header" fetch origin "$SOURCE_SHA" --depth=1
          git -C thought-forest checkout --detach "$SOURCE_SHA"

          git add data-products/knowledge-public-v1.lock.json thought-forest
          git commit -m "chore(data): pin knowledge-public-v1 to ${SOURCE_SHA:0:12}"
          gh auth setup-git
          git push --force --set-upstream origin "$SYNC_BRANCH"

      - name: Open PR if not already open
        if: steps.lock.outputs.changed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_SHA: ${{ steps.target.outputs.source_sha }}
        run: |
          set -euo pipefail
          open_pr="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$SYNC_BRANCH" --state open --json number --jq '.[0].number // empty')"
          if [ -n "$open_pr" ]; then
            echo "knowledge-public-v1 sync PR #$open_pr updated in place."
          else
            gh pr create               --base main               --head "$SYNC_BRANCH"               --title "chore(data): update knowledge-public-v1 to ${SOURCE_SHA:0:12}"               --body "Atomically pins the immutable Thought Forest `knowledge-public-v1` projection and the private deployment gitlink to source revision `$SOURCE_SHA`. Merge only after CI validates the projection-backed build."
          fi

      - name: Report no-op
        if: steps.lock.outputs.changed != 'true'
        run: echo "knowledge-public-v1 lock and private deployment gitlink already point to the published projection source revision."
